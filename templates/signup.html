{% extends "base.html" %}

{% block title %}Create Account | Shibani Fashion{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-slate-50">
    <div class="max-w-md w-full space-y-8 bg-white p-8 sm:p-10 rounded-3xl shadow-xl border border-slate-100 transition duration-300 hover:shadow-2xl">
        <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-slate-800 tracking-tight">
                Create Account
            </h2>
            <p class="mt-2 text-center text-sm text-slate-400">
                Join Shibani Club to earn 100 free loyalty points instantly!
            </p>
        </div>
        
        <form class="mt-8 space-y-6" id="signupForm">
            <div class="rounded-md space-y-4">
                <div>
                    <label for="signupFullNameInput" class="block text-sm font-semibold text-slate-600 mb-1.5">Full Name</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                            <i class="fa-solid fa-address-card"></i>
                        </span>
                        <input id="signupFullNameInput" type="text" required 
                               class="appearance-none rounded-2xl relative block w-full pl-10 pr-4 py-3 border border-slate-200 placeholder-slate-400 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm transition duration-200" 
                               placeholder="e.g. John Doe">
                    </div>
                </div>
                <div>
                    <label for="signupUsernameInput" class="block text-sm font-semibold text-slate-600 mb-1.5">Choose Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input id="signupUsernameInput" type="text" autocomplete="username" required 
                               class="appearance-none rounded-2xl relative block w-full pl-10 pr-4 py-3 border border-slate-200 placeholder-slate-400 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm transition duration-200" 
                               placeholder="e.g. johndoe12">
                    </div>
                </div>
                <div>
                    <label for="signupPasswordInput" class="block text-sm font-semibold text-slate-600 mb-1.5">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input id="signupPasswordInput" type="password" autocomplete="new-password" required 
                               class="appearance-none rounded-2xl relative block w-full pl-10 pr-4 py-3 border border-slate-200 placeholder-slate-400 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm transition duration-200" 
                               placeholder="Min 6 characters">
                    </div>
                </div>
            </div>

            <div>
                <button type="submit" id="signupSubmitBtn"
                        class="group relative w-full flex justify-center py-3.5 px-4 border border-transparent text-sm font-bold rounded-2xl text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-300 shadow-lg shadow-indigo-100 hover:-translate-y-0.5">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3 text-indigo-500 group-hover:text-indigo-400">
                        <i class="fa-solid fa-user-plus"></i>
                    </span>
                    Sign Up
                </button>
            </div>
            
            <div id="signupMessage" class="text-sm text-center font-semibold text-red-500 hidden mt-2"></div>
        </form>

        <div class="text-center">
            <p class="text-sm text-slate-500">
                Already have an account? 
                <a href="/login" class="font-bold text-indigo-600 hover:text-indigo-500 transition">Login here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
