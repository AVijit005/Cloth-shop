{% extends "base.html" %}

{% block title %}My Orders | SHIBANI{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
    <div>
        <span class="text-eyebrow">Purchase History</span>
        <h1 class="text-xl sm:text-2xl font-display font-light tracking-[0.15em] text-[var(--neutral-900)] uppercase mt-1">My Orders</h1>
    </div>

    <div id="ordersPageContainer" class="space-y-6 mt-10">
        <!-- Order cards loaded by JS -->
    </div>

    <!-- Empty State -->
    <div id="ordersEmptyState" class="empty-state hidden">
        <div class="empty-state-icon"><i class="fa-solid fa-receipt"></i></div>
        <h3>No orders yet</h3>
        <p>Start shopping to build your order history.</p>
        <a href="/shop" class="btn-primary mt-6">
            <i class="fa-regular fa-eye"></i> Start Shopping
        </a>
    </div>
</div>

<!-- Receipt Modal -->
<div id="receiptModal" class="modal-overlay hidden">
    <div class="modal-content max-w-md">
        <div class="p-6 sm:p-8 space-y-6">
            <div class="text-center pb-4 border-b border-dashed border-[var(--neutral-200)]">
                <h3 class="text-sm font-medium tracking-widest text-[var(--neutral-900)] uppercase">Order Receipt</h3>
                <p class="text-[10px] text-[var(--neutral-400)] uppercase tracking-widest mt-1">SHIBANI Fashion</p>
            </div>
            <div id="receiptModalBody" class="space-y-4 text-xs text-[var(--neutral-500)]"></div>
            <div class="flex gap-3 border-t border-dashed border-[var(--neutral-200)] pt-6">
                <button type="button" id="printReceiptBtn" class="btn-primary flex-grow">
                    <i class="fa-solid fa-print"></i> Print
                </button>
                <button type="button" id="closeReceiptBtn" class="btn-secondary">
                    Close
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
