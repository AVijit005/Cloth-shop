{% extends "base.html" %}

{% block title %}My Orders | Shibani Fashion{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10 sm:py-16">
    <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight mb-8">My Orders</h1>
    
    <div id="ordersPageContainer" class="space-y-6">
        <!-- Order cards loaded dynamically by JS -->
    </div>
    
    <!-- Empty state -->
    <div id="ordersEmptyState" class="hidden text-center py-20 bg-white border border-slate-100 rounded-3xl p-8 space-y-4 shadow-sm">
        <span class="text-5xl text-slate-300 block"><i class="fa-solid fa-receipt"></i></span>
        <h3 class="font-extrabold text-lg text-slate-700">No orders found</h3>
        <p class="text-slate-400 text-sm max-w-xs mx-auto">You haven't placed any checkouts yet. Buy premium clothes to build history.</p>
        <a href="/shop" class="inline-block px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow">Start Shopping</a>
    </div>
</div>

<!-- Receipt Modal Overlay (Hidden by default) -->
<div id="receiptModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[999] flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl max-w-md w-full shadow-2xl p-6 sm:p-8 border border-slate-100 space-y-6 transform scale-95 transition-all duration-300">
        <!-- Header -->
        <div class="text-center pb-4 border-b border-dashed border-slate-200">
            <h3 class="text-xl font-black text-slate-800 tracking-tight uppercase">Order Receipt</h3>
            <p class="text-xs text-slate-400 mt-1">Shibani Fashion Store Flagship</p>
        </div>
        
        <!-- Details grid -->
        <div id="receiptModalBody" class="space-y-4 text-xs font-semibold text-slate-500">
            <!-- Content loaded dynamically -->
        </div>
        
        <!-- Actions -->
        <div class="flex gap-3 border-t border-dashed border-slate-200 pt-6">
            <button type="button" id="printReceiptBtn" class="flex-grow py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm rounded-xl shadow transition flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-print"></i> Print Invoice
            </button>
            <button type="button" id="closeReceiptBtn" class="py-3 px-5 border border-slate-200 hover:bg-slate-50 text-slate-600 font-bold text-sm rounded-xl transition">
                Close
            </button>
        </div>
    </div>
</div>
{% endblock %}
