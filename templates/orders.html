{% extends "base.html" %}

{% block title %}My Orders | Shibani Fashion{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10 sm:py-16 animate-fade-in">
    <h1 class="text-xl font-light uppercase tracking-widest text-neutral-900 mb-8">My Orders</h1>
    
    <div id="ordersPageContainer" class="space-y-6">
        <!-- Order cards loaded dynamically by JS -->
    </div>
    
    <!-- Empty state -->
    <div id="ordersEmptyState" class="hidden text-center py-20 bg-white border border-neutral-200 p-8 space-y-4">
        <span class="text-3xl text-neutral-300 block"><i class="fa-solid fa-receipt"></i></span>
        <h3 class="font-medium text-xs tracking-widest uppercase text-neutral-800">No orders found</h3>
        <p class="text-neutral-400 text-[10px] uppercase tracking-wider font-light max-w-xs mx-auto">You haven't placed any checkouts yet. Buy premium clothes to build history.</p>
        <a href="/shop" class="inline-block px-6 py-3 bg-neutral-900 hover:bg-neutral-800 text-white font-light text-[10px] uppercase tracking-widest transition duration-300">Start Shopping</a>
    </div>
</div>

<!-- Receipt Modal Overlay (Hidden by default) -->
<div id="receiptModal" class="fixed inset-0 bg-neutral-950/60 backdrop-blur-sm z-[999] flex items-center justify-center p-4 hidden">
    <div class="bg-white max-w-md w-full p-6 sm:p-8 border border-neutral-200 space-y-6 transform scale-95 transition-all duration-300">
        <!-- Header -->
        <div class="text-center pb-4 border-b border-dashed border-neutral-200">
            <h3 class="text-sm font-medium text-neutral-900 tracking-widest uppercase">Order Receipt</h3>
            <p class="text-[10px] text-neutral-400 uppercase tracking-widest font-light mt-1">Shibani Fashion Store Flagship</p>
        </div>
        
        <!-- Details grid -->
        <div id="receiptModalBody" class="space-y-4 text-xs font-light text-neutral-500">
            <!-- Content loaded dynamically -->
        </div>
        
        <!-- Actions -->
        <div class="flex gap-3 border-t border-dashed border-neutral-200 pt-6">
            <button type="button" id="printReceiptBtn" class="flex-grow py-3 bg-neutral-900 hover:bg-neutral-800 text-white font-light text-[10px] uppercase tracking-widest transition flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-print"></i> Print Invoice
            </button>
            <button type="button" id="closeReceiptBtn" class="py-3 px-5 border border-neutral-200 hover:bg-neutral-50 text-neutral-500 font-light text-[10px] uppercase tracking-widest transition">
                Close
            </button>
        </div>
    </div>
</div>
{% endblock %}
