{% extends "admin_base.html" %}

{% block title %}Customers | Admin Console{% endblock %}
{% block page_title %}Customers Directory{% endblock %}

{% block content %}
<div class="space-y-6">
    <!-- Controls Header -->
    <div class="bg-white border border-neutral-200 p-6 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="relative w-full sm:max-w-xs">
            <input type="text" id="adminCustomerSearch" placeholder="Search customers by name or ID..." 
                   class="w-full bg-neutral-50 border border-neutral-200 px-4 py-2.5 pl-10 text-[10px] uppercase tracking-widest font-light placeholder-neutral-400 focus:outline-none focus:border-neutral-900 focus:ring-0" />
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-neutral-400 text-xs">
                <i class="fa-solid fa-magnifying-glass"></i>
            </span>
        </div>
    </div>
    
    <!-- Customers Table Card -->
    <div class="bg-white border border-neutral-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full min-w-[700px] text-left border-collapse">
                <thead>
                    <tr class="bg-neutral-50 border-b border-neutral-200 text-[10px] font-medium text-neutral-400 uppercase tracking-widest">
                        <th class="py-4 px-6">Customer ID</th>
                        <th class="py-4 px-6">Account Profile</th>
                    </tr>
                </thead>
                <tbody id="adminCustomersTableBody" class="divide-y divide-neutral-100 text-xs font-light text-neutral-600 tracking-wide">
                    <!-- Skeleton rows -->
                    <tr class="animate-pulse"><td class="py-4 px-6"><div class="h-3 skeleton-pulse w-14 rounded"></div></td><td class="py-4 px-6 space-y-1"><div class="h-3 skeleton-pulse w-36 rounded"></div><div class="h-2 skeleton-pulse w-28 rounded"></div></td></tr>
                    <tr class="animate-pulse"><td class="py-4 px-6"><div class="h-3 skeleton-pulse w-14 rounded"></div></td><td class="py-4 px-6 space-y-1"><div class="h-3 skeleton-pulse w-40 rounded"></div><div class="h-2 skeleton-pulse w-24 rounded"></div></td></tr>
                    <tr class="animate-pulse"><td class="py-4 px-6"><div class="h-3 skeleton-pulse w-14 rounded"></div></td><td class="py-4 px-6 space-y-1"><div class="h-3 skeleton-pulse w-32 rounded"></div><div class="h-2 skeleton-pulse w-32 rounded"></div></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
