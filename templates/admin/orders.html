{% extends "admin_base.html" %}

{% block title %}Orders | Admin Console{% endblock %}
{% block page_title %}Orders Manager{% endblock %}

{% block content %}
<div class="space-y-6">
    <!-- Controls Header -->
    <div class="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="relative w-full sm:max-w-xs">
            <input type="text" id="adminOrderSearchInput" placeholder="Search orders by customer or ID..." 
                   class="w-full bg-slate-100 border-none rounded-xl px-4 py-2.5 pl-10 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20" />
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm">
                <i class="fa-solid fa-magnifying-glass"></i>
            </span>
        </div>
        
        <!-- Status Filter tabs -->
        <nav class="flex flex-wrap gap-1.5 w-full sm:w-auto" id="orderTabs">
            <button class="order-tab px-4 py-2 text-xs font-bold bg-indigo-600 text-white rounded-xl shadow transition" data-status="all">All</button>
            <button class="order-tab px-4 py-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl transition" data-status="New">New</button>
            <button class="order-tab px-4 py-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl transition" data-status="Processing">Processing</button>
            <button class="order-tab px-4 py-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl transition" data-status="Shipped">Shipped</button>
            <button class="order-tab px-4 py-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl transition" data-status="Delivered">Delivered</button>
            <button class="order-tab px-4 py-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl transition" data-status="Cancelled">Cancelled</button>
        </nav>
    </div>
    
    <!-- Orders Table Card -->
    <div class="bg-white border border-slate-200 rounded-3xl overflow-hidden shadow-sm">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50 border-b border-slate-100 text-xs font-bold text-slate-400 uppercase tracking-wider">
                        <th class="py-4 px-6">Order ID</th>
                        <th class="py-4 px-6">Customer Details</th>
                        <th class="py-4 px-6">Items Purchased</th>
                        <th class="py-4 px-6">Total Billing</th>
                        <th class="py-4 px-6">Status Details</th>
                    </tr>
                </thead>
                <tbody id="adminOrdersTableBody" class="divide-y divide-slate-100 text-sm font-semibold text-slate-600">
                    <!-- Loaded dynamically via JS -->
                    <tr>
                        <td colspan="5" class="py-12 text-center text-slate-400">Loading customer orders...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
