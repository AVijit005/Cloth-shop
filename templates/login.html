{% extends "base.html" %}

{% block title %}Login | Shibani Fashion{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-slate-50">
    <div class="max-w-md w-full space-y-8 bg-white p-8 sm:p-10 rounded-3xl shadow-xl border border-slate-100 transition duration-300 hover:shadow-2xl">
        <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-slate-800 tracking-tight">
                Welcome back
            </h2>
            <p class="mt-2 text-center text-sm text-slate-400">
                Log in to shop collections and view your loyalty rewards.
            </p>
        </div>
        
        <form class="mt-8 space-y-6" id="loginForm">
            <div class="rounded-md space-y-4">
                <div>
                    <label for="usernameInput" class="block text-sm font-semibold text-slate-600 mb-1.5">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input id="usernameInput" type="text" autocomplete="username" required 
                               class="appearance-none rounded-2xl relative block w-full pl-10 pr-4 py-3 border border-slate-200 placeholder-slate-400 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm transition duration-200" 
                               placeholder="e.g. admin or customer">
                    </div>
                </div>
                <div>
                    <label for="passwordInput" class="block text-sm font-semibold text-slate-600 mb-1.5">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input id="passwordInput" type="password" autocomplete="current-password" required 
                               class="appearance-none rounded-2xl relative block w-full pl-10 pr-4 py-3 border border-slate-200 placeholder-slate-400 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm transition duration-200" 
                               placeholder="••••••••">
                    </div>
                </div>
            </div>

            <div>
                <button type="submit" id="loginSubmitBtn"
                        class="group relative w-full flex justify-center py-3.5 px-4 border border-transparent text-sm font-bold rounded-2xl text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-300 shadow-lg shadow-indigo-100 hover:-translate-y-0.5">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3 text-indigo-500 group-hover:text-indigo-400">
                        <i class="fa-solid fa-lock-open"></i>
                    </span>
                    Sign In
                </button>
            </div>
            
            <div id="loginMessage" class="text-sm text-center font-semibold text-red-500 hidden mt-2"></div>
        </form>

        <div class="text-center">
            <p class="text-sm text-slate-500">
                Don't have an account? 
                <a href="/signup" class="font-bold text-indigo-600 hover:text-indigo-500 transition">Create account</a>
            </p>
        </div>

        <!-- Quick Demo Credentials Box -->
        <div class="border-t border-slate-100 pt-6 mt-6">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider text-center mb-4">Quick Demo Logins</h3>
            <div class="grid grid-cols-2 gap-3">
                <button id="quickLoginAdminBtn" class="flex flex-col items-center justify-center p-3 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-100 border border-slate-100 rounded-2xl transition group text-left">
                    <span class="text-xs font-bold text-slate-700 group-hover:text-indigo-600">Admin Account</span>
                    <span class="text-[10px] text-slate-400 mt-1">admin / admin123</span>
                </button>
                <button id="quickLoginCustomerBtn" class="flex flex-col items-center justify-center p-3 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-100 border border-slate-100 rounded-2xl transition group text-left">
                    <span class="text-xs font-bold text-slate-700 group-hover:text-indigo-600">Customer Account</span>
                    <span class="text-[10px] text-slate-400 mt-1">customer / customer123</span>
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
